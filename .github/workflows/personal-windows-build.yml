# Personal, unsigned Windows x64 build of this fork (not part of any upstream PR).
name: "Personal Windows Build"

on:
  push:
    branches: ["custom/**"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      sign-binaries: false
      asset-prefix: "handy-personal"
      upload-artifacts: true
    secrets: inherit
